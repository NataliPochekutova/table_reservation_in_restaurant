<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Управление рассылками</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body, html {
      height: 100%;
      margin: 0;
    }
    main {
      height: 100vh;
      position: relative;
    }
    .custom-btn {
      background-color: black;
      color: white;
      border: none;
    }
    .custom-btn:hover {
      background-color: #222;
    }
    .custom-btn:active,
    .custom-btn.active {
      background-color: blue !important;
      color: white;
    }


    .top-right-buttons {
      position: absolute;
      top: 10px;
      right: 20px;
      z-index: 1050;
    }
  </style>
</head>
<body>

<main class="d-flex flex-nowrap">
    <div class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark" style="width:280px;">
        <h1 class="fs-4">Управление рассылками</h1>

        <hr />

        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item mb-2">
                <a href="{}" class="btn custom-btn w-100 text-start" onclick="setActive(this)">
                    Главная страница</a>
            </li>
            <li class="nav-item mb-2">
                <a href="{}" class="btn custom-btn w-100 text-start" onclick="setActive(this)">
                    Управление клиентами</a>
            </li>
            <li class="nav-item mb-2">
                <a href="{}" class="btn custom-btn w-100 text-start" onclick="setActive(this)">
                    Управление сообщениями</a>
            </li>
            <li class="nav-item mb-2">
                <a href="{}" class="btn custom-btn w-100 text-start" onclick="setActive(this)">
                    Управление рассылками</a>
            </li>
            <li class="nav-item mb-2">
                <a href="{}" class="btn custom-btn w-100 text-start" onclick="setActive(this)">
                    Данные по попыткам рассылки</a>
            </li>
            <li class="nav-item mb-2">
                <a href="{% url 'users:users_list' %}" class="btn custom-btn w-100 text-start" onclick="setActive(this)">
                    Список пользователей</a>
            </li>

        </ul>
    </div>


    <div class="top-right-buttons d-flex gap-2">
        {% if user.is_authenticated %}
            <a class="p-2 btn btn-outline-primary" href="/users/logout">Выход</a>
        {% else %}
            <a class="p-2 btn btn-outline-primary" href="/users/login">Вход</a>
            <a class="p-2 btn btn-outline-primary" href="/users/register">Регистрация</a>
        {% endif %}
    </div>


    <div style="flex:1; padding:20px;">
        {% block content %}
        {% endblock %}
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
